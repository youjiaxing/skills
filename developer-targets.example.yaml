# 本文件是开发链接配置模板。
# 首次执行链接命令时，脚本会复制为 developer-targets.local.yaml。
# 本机配置不会纳入版本控制；请取消需要使用的目录注释，或运行 npm run init。

targets: []

# 常见 Agent 的用户全局 skill 目录（默认全部禁用）：
# Claude Code
# - ~/.claude/skills

# Codex
# - ~/.codex/skills

# Agent Skills 通用目录
# - ~/.agents/skills

# CodeBuddy Code
# - ~/.codebuddy/skills

# Grok Build
# - ~/.grok/skills

# Antigravity 原生支持（自动维护 ~/.gemini/config/skills.json 中的 entries）：
antigravity: false

# 个人全局提示词文件软链接目标（默认全部禁用，启用后默认指向 prompts/AGENTS.md）：
# 支持字符串简写，或使用对象指定独立源文件：{ target: ~/.some-agent/AGENTS.md, source: prompts/custom.md }
prompt_targets: []
# - ~/.codex/AGENTS.md
# - ~/.grok/AGENTS.md
# - ~/.gemini/config/AGENTS.md
# - ~/.claude/CLAUDE.md
# - ~/.codebuddy/CODEBUDDY.md
